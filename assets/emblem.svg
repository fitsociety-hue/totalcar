<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="35%" stop-color="#E5A93C" />
      <stop offset="70%" stop-color="#B87C1D" />
      <stop offset="100%" stop-color="#F5C768" />
    </linearGradient>
    <radialGradient id="ringBg" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#0A0A0A" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <linearGradient id="deepGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5C768" />
      <stop offset="100%" stop-color="#B87C1D" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Black Background Circle -->
  <circle cx="100" cy="100" r="96" fill="#0A0A0A" />

  <!-- Outer Gold Ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldGradient)" stroke-width="4" filter="url(#goldGlow)" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(229, 169, 60, 0.25)" stroke-width="1" />

  <!-- Inner Gold Decorative Ring -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="rgba(229, 169, 60, 0.15)" stroke-width="0.5" stroke-dasharray="3,2" />

  <!-- People Circle (5 stylized people holding hands) -->
  <g transform="translate(100, 100)" fill="url(#goldGradient)" stroke="none">
    <!-- Person 1 (Top) -->
    <g transform="rotate(0)">
      <circle cx="0" cy="-52" r="8" />
      <path d="M -6,-42 C -6,-42 -10,-28 -14,-22 L -6,-22 L -4,-32 L 0,-32 L 4,-32 L 6,-22 L 14,-22 C 10,-28 6,-42 6,-42 Z" />
    </g>
    <!-- Person 2 (Upper Right) -->
    <g transform="rotate(72)">
      <circle cx="0" cy="-52" r="8" />
      <path d="M -6,-42 C -6,-42 -10,-28 -14,-22 L -6,-22 L -4,-32 L 0,-32 L 4,-32 L 6,-22 L 14,-22 C 10,-28 6,-42 6,-42 Z" />
    </g>
    <!-- Person 3 (Lower Right) -->
    <g transform="rotate(144)">
      <circle cx="0" cy="-52" r="8" />
      <path d="M -6,-42 C -6,-42 -10,-28 -14,-22 L -6,-22 L -4,-32 L 0,-32 L 4,-32 L 6,-22 L 14,-22 C 10,-28 6,-42 6,-42 Z" />
    </g>
    <!-- Person 4 (Lower Left) -->
    <g transform="rotate(216)">
      <circle cx="0" cy="-52" r="8" />
      <path d="M -6,-42 C -6,-42 -10,-28 -14,-22 L -6,-22 L -4,-32 L 0,-32 L 4,-32 L 6,-22 L 14,-22 C 10,-28 6,-42 6,-42 Z" />
    </g>
    <!-- Person 5 (Upper Left) -->
    <g transform="rotate(288)">
      <circle cx="0" cy="-52" r="8" />
      <path d="M -6,-42 C -6,-42 -10,-28 -14,-22 L -6,-22 L -4,-32 L 0,-32 L 4,-32 L 6,-22 L 14,-22 C 10,-28 6,-42 6,-42 Z" />
    </g>

    <!-- Connecting hands circle arc -->
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Center Star Accent -->
  <g transform="translate(100, 100)" fill="url(#deepGold)">
    <polygon points="0,-12 3,-4 12,-4 5,2 7,10 0,6 -7,10 -5,2 -12,-4 -3,-4" />
  </g>

  <!-- Bottom Text Arc: "어울림" -->
  <path id="textArc" d="M 35,140 A 80,80 0 0,0 165,140" fill="none" />
  <text fill="url(#goldGradient)" font-size="10" font-weight="700" letter-spacing="4">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">어 울 림</textPath>
  </text>
</svg>
