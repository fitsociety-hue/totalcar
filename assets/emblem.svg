<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="35%" stop-color="#E5A93C" />
      <stop offset="70%" stop-color="#B87C1D" />
      <stop offset="100%" stop-color="#F5C768" />
    </linearGradient>
    <linearGradient id="deepGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5C768" />
      <stop offset="100%" stop-color="#B87C1D" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(229, 169, 60, 0.15)" />
      <stop offset="100%" stop-color="rgba(10, 10, 10, 0)" />
    </radialGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Black Background Circle -->
  <circle cx="100" cy="100" r="96" fill="#0A0A0A" />

  <!-- Outer Gold Ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#goldGradient)" stroke-width="4" filter="url(#goldGlow)" />
  <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(229, 169, 60, 0.25)" stroke-width="1" />

  <!-- Inner Gold Decorative Ring -->
  <circle cx="100" cy="100" r="78" fill="none" stroke="rgba(229, 169, 60, 0.15)" stroke-width="0.5" stroke-dasharray="3,2" />

  <!-- Subtle center glow -->
  <circle cx="100" cy="95" r="50" fill="url(#centerGlow)" />

  <!-- ========================================= -->
  <!-- Steering Wheel Emblem                     -->
  <!-- ========================================= -->
  <g transform="translate(100, 95)" fill="none" stroke="url(#goldGradient)" filter="url(#softGlow)">

    <!-- Outer steering wheel rim -->
    <circle cx="0" cy="0" r="45" stroke-width="6" stroke-linecap="round" />

    <!-- Inner hub ring -->
    <circle cx="0" cy="0" r="14" stroke-width="3" />

    <!-- Spoke 1: Top (12 o'clock) -->
    <line x1="0" y1="-14" x2="0" y2="-39" stroke-width="5" stroke-linecap="round" />

    <!-- Spoke 2: Lower-Left (7 o'clock) -->
    <line x1="-12.1" y1="7" x2="-33.8" y2="19.5" stroke-width="5" stroke-linecap="round" />

    <!-- Spoke 3: Lower-Right (5 o'clock) -->
    <line x1="12.1" y1="7" x2="33.8" y2="19.5" stroke-width="5" stroke-linecap="round" />

  </g>

  <!-- Center hub accent dot -->
  <circle cx="100" cy="95" r="4" fill="url(#deepGold)" />

  <!-- Bottom Text Arc: "어울림" -->
  <path id="textArc" d="M 35,145 A 80,80 0 0,0 165,145" fill="none" />
  <text fill="url(#goldGradient)" font-size="10" font-weight="700" letter-spacing="4">
    <textPath href="#textArc" startOffset="50%" text-anchor="middle">어 울 림</textPath>
  </text>
</svg>
